<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ 🌿</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #1b5e20;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(27, 94, 32, 0.1);
            text-align: center;
            max-width: 480px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 2px solid #a5d6a7;
        }
        h1 {
            font-size: 24px;
            color: #2e7d32;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .icon-container {
            font-size: 70px;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        .btn {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(46, 125, 50, 0.2);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(46, 125, 50, 0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>سڵاو کەسی ئازیزم.. ✨</h1>
        <p>فەرموو بەرەو ساتێک لە ئارامیی ڕاستەقینە، دوور لە جەنجاڵی و ڕاکەڕاکی دنیا. ئەم لاپەڕەیەم بە تایبەت بۆ تۆ داناوە تا بزانیت هەمیشە دڵت بە چی ئارام دەبێتەوە.</p>
        
        <div class="icon-container">🕌</div>

        <!-- وتە گۆڕدراوەکە لێرەدایە -->
        <p style="font-size: 18px; font-weight: bold; color: #2e7d32; direction: ltr;">
            "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"
        </p>
        
        <button class="btn" id="quran-btn" onclick="toggleQuran()">کلیک بکە بۆ خوێندنەوەی قورئانی پیرۆز 📖</button>
    </div>

    <!-- لێرەدا دەنگی سورەتی الملک بە دەنگی العفاسي دانراوە -->
    <audio id="quran-audio" loop>
        <source src="https://server11.mp3quran.net/afs/067.mp3" type="audio/mp3">
    </audio>

    <script>
        const audio = document.getElementById('quran-audio');
        const btn = document.getElementById('quran-btn');

        function toggleQuran() {
            if (audio.paused) {
                audio.play().catch(e => console.log("کێشە لە لۆدکردنی دەنگەکەدا هەیە:", e));
                btn.innerHTML = "کپکردنی دەنگەکە 🔇";
                btn.style.background = "linear-gradient(135deg, #a4b0be, #747d8c)";
            } else {
                audio.pause();
                btn.innerHTML = "کلیک بکە بۆ خوێندنەوەی قورئانی پیرۆز 📖";
                btn.style.background = "linear-gradient(135deg, #2e7d32, #1b5e20)";
            }
        }
    </script>
</body>
</html>
