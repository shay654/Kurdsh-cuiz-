<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ 🌿✨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5ebe0, #e3d5ca);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #4e3526;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(78, 53, 38, 0.15);
            text-align: center;
            max-width: 480px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 2px solid #d5bdaf;
            transition: all 0.5s ease;
        }
        h1 {
            font-size: 24px;
            color: #6f4e37;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .cup-container {
            font-size: 80px;
            margin: 20px 0;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        /* ئەنیمەیشنی دووکەڵەکە */
        .steam {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            opacity: 0;
            animation: steamUp 4s linear infinite;
        }
        .btn {
            background: linear-gradient(135deg, #8b5a2b, #6f4e37);
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(111, 78, 55, 0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(111, 78, 55, 0.4);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes steamUp {
            0% { top: -10px; opacity: 0; transform: translateX(-50%) scale(0.8); }
            50% { opacity: 0.5; transform: translateX(-40%) scale(1.1); }
            100% { top: -50px; opacity: 0; transform: translateX(-60%) scale(1.4); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>سڵاو کەسی ئازیزم.. 🌿</h1>
        <p>دەزانم ژیان کەمێک جەنجاڵە و ڕەنگە ئێستا ماندوو بیت. ئەم لاپەڕەیەم بە تایبەت بۆ تۆ دروستکردووە تا بۆ چەند خولەکێک هەموو شتێک دابنێیت و پشوو بدەیت.</p>
        
        <div class="cup-container">
            <div class="steam">~~</div>
            ☕
        </div>

        <!-- ئایەتی پیرۆز لە جێگەی وتەکە دانراوە -->
        <p style="font-size: 19px; font-weight: bold; color: #8b5a2b; direction: ltr;">
            "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"
        </p>
        
        <!-- دوگمەی کۆنترۆڵکردنی دەنگی قورئانەکە -->
        <button class="btn" id="quran-btn" onclick="toggleQuran()">کلیک بکە بۆ خوێندنەوەی قورئانی پیرۆز 📖</button>
    </div>

    <!-- لێرەدا بەستەری دەنگی سوورەتی المُلک دانراوە -->
    <audio id="quran-audio" loop>
        <source src="https://server11.mp3quran.net/afs/067.mp3" type="audio/mp3">
    </audio>

    <script>
        const quran = document.getElementById('quran-audio');
        const btn = document.getElementById('quran-btn');

        function toggleQuran() {
            if (quran.paused) {
                quran.play().catch(e => console.log("کێشە لە لۆدکردنی دەنگەکەدا هەیە:", e));
                btn.innerHTML = "کپکردنی دەنگەکە 🔇";
                btn.style.background = "linear-gradient(135deg, #a4b0be, #747d8c)";
            } else {
                quran.pause();
                btn.innerHTML = "کلیک بکە بۆ خوێندنەوەی قورئانی پیرۆز 📖";
                btn.style.background = "linear-gradient(135deg, #8b5a2b, #6f4e37)";
            }
        }
    </script>
</body>
</html>
