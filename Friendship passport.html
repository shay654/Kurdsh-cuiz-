<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاسپۆرتی هاوڕێیەتی</title>
    <style>
        :root {
            --primary-color: #ff85a2;
            --secondary-color: #f72585;
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-pink: #ffb7b2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(247, 37, 133, 0.15);
            padding: 25px;
            border: 2px solid #ffccd5;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed #ffb7b2;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--secondary-color);
            margin: 0;
            font-size: 24px;
        }

        .header p {
            color: #b5838d;
            font-size: 14px;
            margin-top: 5px;
        }

        .love-quote {
            background-color: #fff5f7;
            border-right: 4px solid var(--secondary-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #d81159;
            font-weight: bold;
            text-align: center;
        }

        .quiz-section {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #ffe5ec;
        }

        .question {
            font-weight: bold;
            color: #6d597a;
            margin-bottom: 15px;
            text-align: center;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #ffe5ec;
            color: #6d597a;
            border: 1px solid #ffc2d1;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-align: right;
        }

        .option-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background-color: #fff0f3;
            border: 1px dashed var(--secondary-color);
            text-align: center;
            display: none;
            color: #800f2f;
            font-weight: bold;
            line-height: 1.6;
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #b5838d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌸 پاسپۆرتی هاوڕێیەتی 🌸</h1>
        <p>بەکارهێنانی تایبەت بۆ هاوڕێ ئەزیزەکەم</p>
    </div>

    <!-- ڕستە تایبەتەکەی تۆ -->
    <div class="love-quote">
        "من تۆم زۆر خۆشدەوێت، هەرگیز ئەوە لەبیرنەکەیت. من هەمیشە لەگەڵتم لە هەموو خۆشی و ناخۆشیەکان نازدارەکەم 💖"
    </div>

    <!-- بەشی یاری و پرسیارەکان -->
    <div class="quiz-section">
        <div class="question">یەکێک لەم هەڵبژاردنانە دیاری بکە بۆ دەستپێکردنی یارییەکە:</div>
        <div class="options">
            <button class="option-btn" onclick="showResult(1)">🌸 ڕاستگۆیی و وەفاداری لە نێوانماندا</button>
            <button class="option-btn" onclick="showResult(2)">🌷 جوانترین یادگاری کە پێکەوە هۆنراوەتەوە</button>
            <button class="option-btn" onclick="showResult(3)">🎀 ئاستی گرنگیدان و خۆشەویستیمان</button>
            <button class="option-btn" onclick="showResult(4)">🌺 بەڵێنی پشتگیری هەتا هەتایە</button>
        </div>

        <!-- شوێنی نیشاندانی ئەنجامە جیاوازەکان -->
        <div id="result" class="result-box"></div>
    </div>

    <div class="footer-note">
        درستکراوە بە خۆشەویستییەوە 🌷
    </div>
</div>

<script>
    function showResult(optionNumber) {
        var resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        // ئەنجامی جیاواز بۆ هەر وەڵامێک (ئاستی بەرز و تایبەت)
        if (optionNumber === 1) {
            resultDiv.innerHTML = "💌 **ئاستی وەفاداری:** 100%<br>ڕاستگۆیی تۆ پایەی سەرەکی ئەم هاوڕێیەتییەیە، بوونی تۆ دیارییەکی گەورەی ژیانمە!";
        } else if (optionNumber === 2) {
            resultDiv.innerHTML = "📷 **شاکاری یادگارییەکان:** 100%<br>هەر ساتێک بەخۆشی یان بە سەختی تێپەڕیوە، بووەتە ئاڵتوونی‌ترین لاپەڕەی بیرەوەرییەکانمان!";
        } else if (optionNumber === 3) {
            resultDiv.innerHTML = "💖 **ئاستی خۆشەویستی:** بێسنوور!<br>پێویست بە پێوانە ناکات، تۆ لە شوێنێکیت لە دڵدا کە چۆڵ بوونی ئەستەمە!";
        } else if (optionNumber === 4) {
            resultDiv.innerHTML = "🤝 **سۆز و بەڵێن:** هەتا هەتایە<br>لە هەموو ڕێگاکانی ژیاندا شانی بەشانت دەبم و شانازیت پێوە دەکەم نازدارەکەم!";
        }
    }
</script>

</body>
</html>
