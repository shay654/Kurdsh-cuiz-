<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گەلەئەستێرەی دڵ و کونی ڕەش 🌌🖤</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* لاپەڕەی پێشوازی */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            transition: opacity 1s ease;
        }
        .intro-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 400px;
            width: 90%;
        }
        .intro-card h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #f472b6;
            letter-spacing: 2px;
        }
        .btn-start {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
        }
        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(236, 72, 153, 0.6);
        }
        /* دوگمە خولاوەکانی سەر گەلەئەستێرەکە */
        .floating-buttons-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            display: none;
        }
        .orbit-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 8px 16px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, background 0.2s;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .orbit-btn:hover {
            background: #ec4899;
            border-color: #f472b6;
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
        }
        .orbit-btn img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }
        /* پەنجەرەی دەرکەوتنی زانیارییەکان */
        .info-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 10, 25, 0.85);
            border: 1px solid #f472b6;
            padding: 30px;
            border-radius: 24px;
            color: white;
            text-align: center;
            z-index: 20;
            max-width: 350px;
            width: 85%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .info-popup.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .info-popup h2 {
            color: #f472b6;
            margin-top: 0;
            font-size: 22px;
        }
        .info-popup p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.6;
        }
        .btn-close {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-close:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <!-- لاپەڕەی سەرەتایی کورت -->
    <div class="intro-overlay" id="intro">
        <div class="intro-card">
            <div style="font-size: 50px; margin-bottom: 10px;">❤️</div>
            <h1>I LOVE YOU</h1>
            <p>بۆ بینینی گەلەئەستێرەی دڵ کلیک بکە...</p>
            <button class="btn-start" onclick="startMagic()">کـلـیـک بـکـە ✨</button>
        </div>
    </div>

    <!-- شوێنی گەلەئەستێرە سێ ڕەهەندییەکە -->
    <div id="canvas-container"></div>

    <!-- دوگمە خولاوەکان لەسەر شاشەکە -->
    <div class="floating-buttons-container" id="buttons-container"></div>

    <!-- پەنجەرەی پیشاندانی تێکستەکان کاتێک کلیک لە دوگمەکان دەکەیت -->
    <div class="info-popup" id="popup">
        <h2 id="popup-title">ناونیشان</h2>
        <p id="popup-text">لێرەدا نامەکە پیشان دەدرێت...</p>
        <button class="btn-close" onclick="closePopup()">داخستن</button>
    </div>

    <!-- هێنانی Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, galaxyParticles, heartParticles;
        let buttonsData = [
            { text: "خەندەکەت 🌟", title: "خەندەی تۆ", desc: "خەندەکەت ڕووناکییەکە کە هەموو تاریکییەک دەڕەوێنێتەوە.", icon: "✨" },
            { text: "دڵی من هی تۆیە 💓", title: "پەیمان", desc: "تا کۆتایی دنیا ئەم دڵە هەر بۆ تۆ لێدەدات.", icon: "🐻" },
            { text: "شوێنی تایبەتی من 🏡", title: "ئارامی", desc: "تۆ نیشتیمان و حەوانەوەی منی لەم جیھانە جەنجاڵەدا.", icon: "🐰" },
            { text: "ئەستێرەی گەش 🌌", title: "تۆ بێهاوتایت", desc: "تۆ گەشاوەترین ئەستێرەیت لە ئاسمانی ژیانی مندا.", icon: "🌸" }
        ];

        let angleOffset = 0;

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 90);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // ۱. دروستکردنی کونی ڕەش لە ناوەڕاست (ئەستێرە لێکراوەکان بەرەو ناوەوە)
            createGalaxy();

            // ٢. دروستکردنی دڵە گەورە پەمەیییەکەی سەرەوە
            createHeart();

            // دروستکردنی دوگمەکان لە ناو HTML
            buildOrbitButtons();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createGalaxy() {
            const count = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const palette = [
                new THREE.Color('#01cdfe'), new THREE.Color('#b967ff'), 
                new THREE.Color('#05ffa1'), new THREE.Color('#fffb96'),
                new THREE.Color('#ff71ce')
            ];

            for(let i=0; i<count; i++) {
                // شێوەی خولانەوەی لولپێچی گەلەئەستێرە (Spiral)
                const r = Math.random() * 50 + 2;
                const theta = Math.random() * Math.PI * 2 + (r * 0.05); 
                
                positions[i*3] = Math.cos(theta) * r;
                positions[i*3+1] = (Math.random() - 0.5) * (30 / (r*0.2 + 1)); // لە ناوەڕاستدا خەستترە
                positions[i*3+2] = Math.sin(theta) * r;

                const color = palette[Math.floor(Math.random() * palette.length)];
                colors[i*3] = color.r;
                colors[i*3+1] = color.g;
                colors[i*3+2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        function createHeart() {
            const count = 1500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const pinkColor = new THREE.Color('#ff2a85');

            for(let i=0; i<count; i++) {
                const t = Math.random() * Math.PI * 2;
                // هاوکێشەی دڵی سێ ڕەهەندی بەرزکراوەوە
                const x = 1.2 * 16 * Math.pow(Math.sin(t), 3);
                const y = 1.2 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) + 25; // بەرزکراوەتەوە بۆ سەر کونی ڕەشەکە
                const z = (Math.random() - 0.5) * 8;

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                colors[i*3] = pinkColor.r + Math.random()*0.2;
                colors[i*3+1] = pinkColor.g;
                colors[i*3+2] = pinkColor.b + Math.random()*0.1;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);
        }

        function buildOrbitButtons() {
            const container = document.getElementById('buttons-container');
            buttonsData.forEach((data, index) => {
                const btn = document.createElement('button');
                btn.className = 'orbit-btn';
                btn.id = 'orbit-btn-' + index;
                btn.innerHTML = `<span>${data.icon}</span> ${data.text}`;
                btn.onclick = () => showPopup(data.title, data.desc);
                container.appendChild(btn);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // خولانەوەی کونی ڕەش و گەلەئەستێرەکە
            if (galaxyParticles) galaxyParticles.rotation.y += 0.004;
            if (heartParticles) {
                heartParticles.rotation.y += 0.01;
                // لێدانی دڵ (Pulse effect)
                const scale = 1 + Math.sin(Date.now() * 0.005) * 0.03;
                heartParticles.scale.set(scale, scale, scale);
            }

            // خولانەوەی دوگمەکان بە دەوری دڵەکەدا لەسەر شاشە
            angleOffset += 0.01;
            buttonsData.forEach((data, index) => {
                const btn = document.getElementById('orbit-btn-' + index);
                if (btn) {
                    const totalElements = buttonsData.length;
                    const angle = angleOffset + (index / totalElements) * Math.PI * 2;
                    
                    // لێرەدا شوێنی دوگمەکان لە فەزای سێ ڕەهەندییەوە دەگۆڕدرێت بۆ سەر شاشەی مۆبایل
                    const radiusX = window.innerWidth > 600 ? 180 : 130; 
                    const radiusY = window.innerWidth > 600 ? 80 : 50; 

                    const screenX = window.innerWidth / 2 + Math.cos(angle) * radiusX;
                    const screenY = window.innerHeight / 2 + Math.sin(angle) * radiusY - 40; // بەرزکردنەوە لەگەڵ دڵەکە

                    btn.style.left = screenX + 'px';
                    btn.style.top = screenY + 'px';
                }
            });

            renderer.render(scene, camera);
        }

        function showPopup(title, text) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-text').innerText = text;
            document.getElementById('popup').classList.add('active');
        }

        function closePopup() {
            document.getElementById('popup').classList.remove('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startMagic() {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('buttons-container').style.display = 'block';
                initThree();
            }, 1000);
        }
    </script>
</body>
</html>
