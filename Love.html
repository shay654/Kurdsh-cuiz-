<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گەلەئەستێرەی دڵ 🌌✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* لاپەڕەی پێشوازی سەرەتا */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            transition: opacity 1s ease;
        }
        .intro-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        .intro-card h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #f472b6;
        }
        .btn-start {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s;
        }
        .btn-start:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- لاپەڕەی یەکەم بۆ دەستپێکردن -->
    <div class="intro-overlay" id="intro">
        <div class="intro-card">
            <div style="font-size: 50px;">🐻❤️🐰</div>
            <h1>خۆشم دەوێیت</h1>
            <p>کلیک لەسەر دوگمەی خوارەوە بکە بۆ بینینی جادوەکە...</p>
            <button class="btn-start" onclick="startMagic()">دەستپێکردن ✨</button>
        </div>
    </div>

    <!-- شوێنی پیشاندانی گەلەئەستێرە سێ ڕەهەندییەکە -->
    <div id="canvas-container"></div>

    <!-- هێنانی کتێبخانەی Three.js لە ڕێگەی ئینتەرنێتەوە -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, particleSystem;
        const particleCount = 4000; // ژمارەی ئەستێرەکان

        function initThree() {
            const container = document.getElementById('canvas-container');

            // 1. دروستکردنی دیمەن (Scene)
            scene = new THREE.Scene();

            // 2. دروستکردنی کامێرا (Camera)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 150;

            // 3. دروستکردنی ڕێندەرەر (Renderer)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 4. دروستکردنی ئەستێرەکان (Particles)
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorOptions = [
                new THREE.Color('#ff71ce'), // پەمەیی گەش
                new THREE.Color('#01cdfe'), // شینی ئاسمانی
                new THREE.Color('#05ffa1'), // سەوزی جادوویی
                new THREE.Color('#b967ff'), // مۆر
                new THREE.Color('#fffb96')  // زەرد
            ];

            for (let i = 0; i < particleCount; i++) {
                // دروستکردنی جووڵەی بازنەیی هاوشێوەی گەلەئەستێرە
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 80 + 5; 
                
                // لێرەدا هاوکێشەی دروستکردنی شێوەی دڵ جێگیر کراوە لە ناو گەلەئەستێرەکەدا
                let x, y, z;
                if (i > particleCount * 0.4) { 
                    // 60% ئەستێرەکان دەبنە گەلەئەستێرەی ئاسایی
                    x = Math.cos(angle) * radius;
                    y = (Math.random() - 0.5) * 10; 
                    z = Math.sin(angle) * radius;
                } else {
                    // 40% ئەستێرەکان شێوەی دڵەکە لە ناوەندەکەدا دروست دەکەن
                    const t = Math.random() * Math.PI * 2;
                    // هاوکێشەی بیرکاری بۆ نەخشی دڵ (Heart Curve)
                    x = 4 * 16 * Math.pow(Math.sin(t), 3);
                    y = 4 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    z = (Math.random() - 0.5) * 15;
                }

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // دیاریکردنی ڕەنگی هەڕەمەکی بۆ ئەستێرەکان
                const randomColor = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                colors[i * 3] = randomColor.r;
                colors[i * 3 + 1] = randomColor.g;
                colors[i * 3 + 2] = randomColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // شێوازی بینینی خاڵەکان (ئەستێرەکان)
            const material = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // گوێگرتن لە گۆڕانکاری قەبارەی شاشە
            window.addEventListener('resize', onWindowResize, false);
            
            animate();
        }

        // ئەنیمەیشن و خولانەوەی گەلەئەستێرەکە
        function animate() {
            requestAnimationFrame(animate);

            // خولانەوەی خاو بە دەوری تەوەرەکاندا
            if (particleSystem) {
                particleSystem.rotation.y += 0.005;
                particleSystem.rotation.x = 0.5; // کەمێک لاردنی گۆشەی بینین وەک ڤیدیۆکە
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // کاتێک کلیک لە دەستپێکردن دەکرێت
        function startMagic() {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                initThree(); // دەستپێکردنی گەلەئەستێرە سێ ڕەهەندییەکە
            }, 1000);
        }
    </script>
</body>
</html>
